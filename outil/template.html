<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<style>
  :root{
    --navy:#0e2238; --navy2:#16314f; --sky:#3ea4ec; --volt:#ffc928;
    --paper:#f6f8fb; --ink:#0e2238; --muted:#4a5d72;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1080px;height:1350px;overflow:hidden}
  body{font-family:"Inter",sans-serif;background:var(--navy);color:#fff;position:relative}
  .grid{position:absolute;inset:0;background-image:
      linear-gradient(rgba(62,164,236,.07) 1px,transparent 1px),
      linear-gradient(90deg,rgba(62,164,236,.07) 1px,transparent 1px);
      background-size:54px 54px}
  .wrap{position:relative;height:100%;padding:72px 76px 0;display:flex;flex-direction:column}
  .top{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:18px}
  .mark{width:64px;height:64px;border-radius:16px;background:linear-gradient(145deg,#5cb6f2,#1f7fcc);display:grid;place-items:center}
  .mark svg{width:34px;height:34px}
  .name{font-family:"Inter Display","Inter",sans-serif;font-weight:800;font-size:38px;letter-spacing:-.5px}
  .name small{display:block;font-family:"Inter";font-weight:500;font-size:20px;letter-spacing:.2px;color:#a9c3dc;margin-top:2px}
  .kicker{background:var(--volt);color:var(--navy);font-weight:800;font-size:22px;letter-spacing:1.5px;text-transform:uppercase;padding:12px 22px;border-radius:999px}
  h1{font-family:"Inter Display","Inter",sans-serif;font-weight:800;font-size:var(--tsize,78px);line-height:1.02;letter-spacing:-2px;margin-top:64px}
  h1 em{font-style:normal;color:var(--volt)}
  .intro{font-size:30px;line-height:1.35;color:#c9d9e9;margin-top:24px;max-width:900px}
  .card{background:var(--paper);color:var(--ink);border-radius:28px;margin-top:40px;padding:14px 40px;flex:0 0 auto}
  .item{display:flex;gap:26px;padding:22px 0;border-bottom:2px solid #e1e8f0;align-items:flex-start}
  .item:last-child{border-bottom:0}
  .num{flex:0 0 52px;height:52px;border-radius:14px;background:var(--navy);color:var(--volt);font-weight:800;font-size:28px;display:grid;place-items:center}
  .it{font-weight:700;font-size:var(--isize,31px);line-height:1.2}
  .id{font-size:var(--dsize,24px);line-height:1.35;color:var(--muted);margin-top:6px}
  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;padding:30px 0 44px;border-top:2px solid rgba(255,255,255,.12)}
  .cta{font-size:27px;font-weight:600;color:#fff;max-width:560px;line-height:1.3}
  .contact{text-align:right}
  .tel{font-weight:800;font-size:40px;color:var(--volt);letter-spacing:-.5px}
  .web{font-size:24px;color:#a9c3dc;margin-top:2px}
  .note{font-size:18px;color:#7f9ab4;margin-top:14px}
  .item{padding:var(--ipad,22px) 0}
  .tags{margin-top:44px}
  .tags h2{font-size:24px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;color:var(--sky)}
  .chips{display:flex;flex-wrap:wrap;gap:14px;margin-top:18px}
  .chip{border:2px solid rgba(255,201,40,.55);color:#fff;font-weight:600;font-size:27px;padding:12px 24px;border-radius:999px}
</style></head>
<body>
<div class="grid"></div>
<div class="wrap" id="root"></div>
<script>
const d = __DATA__;
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
const hl = s => esc(s).replace(/\*(.+?)\*/g,'<em>$1</em>');
const n = d.items.length;
const r = document.documentElement.style;
if (n >= 5){ r.setProperty('--isize','29px'); r.setProperty('--dsize','22px'); }
if (n <= 3){ r.setProperty('--isize','36px'); r.setProperty('--dsize','27px'); r.setProperty('--ipad','30px'); }
if ((d.title||'').length > 48) r.setProperty('--tsize','66px');
document.getElementById('root').innerHTML = `
  <div class="top">
    <div class="brand">
      <div class="mark"><svg viewBox="0 0 24 24"><path fill="#fff" d="M13.5 2 4 13.6h6.2L9 22l10-12.4h-6.3z"/></svg></div>
      <div class="name">Ave'Lec<small>Électricien · Saint-Ghislain & Mons</small></div>
    </div>
    <div class="kicker">${esc(d.kicker)}</div>
  </div>
  <h1>${hl(d.title)}</h1>
  ${d.intro ? `<p class="intro">${hl(d.intro)}</p>` : ''}
  <div class="card">
    ${d.items.map((it,i)=>`<div class="item"><div class="num">${i+1}</div><div><div class="it">${hl(it.t)}</div>${it.d?`<div class="id">${hl(it.d)}</div>`:''}</div></div>`).join('')}
  </div>
  ${d.tags ? `<div class="tags"><h2>${esc(d.tagsTitle||'Ça concerne notamment')}</h2><div class="chips">${d.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div></div>` : ''}
  <div class="foot">
    <div><div class="cta">${hl(d.cta)}</div>${d.note?`<div class="note">${esc(d.note)}</div>`:''}</div>
    <div class="contact"><div class="tel">0470 53 01 81</div><div class="web">ave-lec.be</div></div>
  </div>`;
</script>
</body></html>
